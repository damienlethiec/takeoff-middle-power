name: Deploy to GitHub Pages

# Without a CNAME file at the repo root:
#   main        → https://damienlethiec.github.io/takeoff-middle-power/
#   any branch  → https://damienlethiec.github.io/takeoff-middle-power/preview/<branch>/
# With a CNAME file holding our own domain (one line, e.g. aitakeoff.eu), the site moves to that domain's root:
#   main        → https://<domain>/          (the deploy also writes CNAME at the root of gh-pages)
#   any branch  → https://<domain>/preview/<branch>/
# Add CNAME only once the domain's DNS points at GitHub Pages (docs/DOMAIN.md), or the site goes dark.
# Deleting a branch removes its preview.
# Requires Settings → Pages → Source: "Deploy from a branch", branch gh-pages, folder / (root).

on:
  push:
    branches-ignore: [gh-pages]
  delete:
  workflow_dispatch:

# Least privilege by default; each job asks for what it needs.
permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    # Only the jobs that write gh-pages share the lock, so e2e never delays the next deploy.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      contents: write # push the build to gh-pages
    steps:
      # Third-party and official actions are pinned to full commit SHAs (tag in the comment).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # actions-gh-pages pushes with its own github_token
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Work out where this branch is published
        id: target
        run: |
          # our own domain if the repo has a CNAME file (a bare host name only), else the github.io project path
          domain=""
          if [ -f CNAME ]; then
            domain=$(head -n 1 CNAME | tr -d '[:space:]')
            if ! echo "$domain" | grep -Eq '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'; then
              echo "CNAME must hold a bare domain such as aitakeoff.eu, got: $domain" >&2
              exit 1
            fi
          fi
          if [ -n "$domain" ]; then
            root="/"
            origin="https://$domain"
          else
            root="/takeoff-middle-power/"
            origin="https://damienlethiec.github.io"
          fi
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "base=$root" >> "$GITHUB_OUTPUT"
            echo "url=$origin$root" >> "$GITHUB_OUTPUT"
            echo "cname=$domain" >> "$GITHUB_OUTPUT"
          else
            slug=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
            echo "dir=preview/$slug" >> "$GITHUB_OUTPUT"
            echo "base=${root}preview/$slug/" >> "$GITHUB_OUTPUT"
            echo "url=$origin${root}preview/$slug/" >> "$GITHUB_OUTPUT"
            echo "cname=" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.target.outputs.base }}
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist
          destination_dir: ${{ steps.target.outputs.dir }}
          keep_files: true
          # main only, and only with our own domain: writes CNAME at the root of gh-pages (previews keep it)
          cname: ${{ steps.target.outputs.cname }}
          commit_message: "Deploy ${{ github.ref_name }}"
      - name: Show the link
        env:
          URL: ${{ steps.target.outputs.url }}
        run: echo "### Play this version → $URL" >> "$GITHUB_STEP_SUMMARY"

  # End-to-end test: plays whole games in Chromium (see e2e/ and playwright.config.ts).
  # Runs next to the deploy job, so a failure flags the run without holding back the preview.
  e2e:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  remove-preview:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    # Only the jobs that write gh-pages share the lock, so e2e never delays the next deploy.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    timeout-minutes: 5
    permissions:
      contents: write # remove the preview folder from gh-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: gh-pages
      - name: Remove the deleted branch's preview
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          slug=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          if [ -d "preview/$slug" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -rq "preview/$slug"
            git commit -m "Remove preview of $BRANCH"
            git push
          fi
